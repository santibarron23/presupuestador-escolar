<!--
  Código para la página "Presupuestá tu lista escolar" de Tiendanube
  (Administrador → Mi tienda → Páginas → editar la página → modo HTML).
  Reemplaza al <iframe> + <script> actuales.

  Qué hace:
  1. Muestra el presupuestador y ajusta el alto del iframe (igual que antes).
  2. Carrito real: el presupuestador le pasa los productos elegidos y este script los agrega al carrito de la
     tienda con el mismo pedido que usa el botón "Agregar al carrito" de cada producto (POST /comprar/).
     Corre en librerialerma.com.ar, así que usa la sesión normal del cliente. Al terminar abre el carrito.
  3. Presupuestos compartidos: si la página se abre con ?p=CÓDIGO, el presupuestador muestra ese presupuesto
     (los links compartidos ya apuntan a esta página por defecto; ver SHARE_BASE_URL en el README).
  4. Reenvía los eventos del presupuestador a Google Analytics (gtag) y Meta (fbq) si ya están en la tienda.
     No agrega trackers nuevos.

  Seguridad: sólo acepta mensajes del dominio del presupuestador y sólo agrega productos (nunca compra,
  nunca toca datos del cliente). Cantidades limitadas a 1–99 y como máximo 120 productos por pedido.

  Copia del código publicado en la tienda (bajado de la página el 2026-11-19). El presupuestador de producción
  corre en Railway (presupuestador-escolar-production.up.railway.app); la tienda ya no usa Render.
-->
<iframe class="presupuestador-iframe" style="width: 100%; min-height: 560px; border: 0; display: block;" title="Presupuestá tu lista escolar" src="https://presupuestador-escolar-production.up.railway.app/widget" scrolling="no"></iframe></p>
<p>
<script>
(function () {
  var ORIGIN = "https://presupuestador-escolar-production.up.railway.app";
  var GREEN = "#0f6e48";
  var PARALLEL = 4;
  var iframe = document.querySelector(".presupuestador-iframe");
  // Link compartido (?p=…): se le pasa al presupuestador. Sólo caracteres seguros.
  var shared = (location.search.match(/[?&]p=([A-Za-z0-9_-]{8,6001})(?:&|$)/) || [])[1];
  if (shared) iframe.src = ORIGIN + "/widget?p=" + shared;

  function reply(msg) { iframe.contentWindow.postMessage(msg, ORIGIN); }

  // Agrega un producto con el mismo formulario que usa la ficha de producto de Tiendanube.
  function addOne(line) {
    var body = new FormData();
    body.append("add_to_cart", String(line.productId));
    body.append("quantity", String(line.quantity));
    (line.options || []).forEach(function (opt, i) { body.append("variation[" + i + "]", opt); });
    return fetch("/comprar/", { method: "POST", body: body, credentials: "same-origin",
      headers: { "X-Requested-With": "XMLHttpRequest", "Accept": "application/json" } })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res && res.success) return res;
        // Sin stock suficiente: la tienda informa cuánto hay; se agrega eso (igual que hace el tema).
        var stock = res && res.errors && res.errors[0] && res.errors[0].stock;
        if (typeof stock === "number" && stock > 0 && stock < line.quantity) {
          return addOne({ productId: line.productId, options: line.options, quantity: stock });
        }
        throw new Error("sin stock");
      });
  }

  // Ventana de progreso: la familia ve que se está armando el carrito y no se va a mitad de camino.
  function el(tag, css, text) {
    var e = document.createElement(tag);
    if (css) e.style.cssText = css;
    if (text) e.textContent = text;
    return e;
  }
  function openProgress(total) {
    var wrap = el("div", "position:fixed;top:0;left:0;right:0;bottom:0;z-index:2147483000;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;");
    var box = el("div", "background:#fff;border-radius:16px;max-width:420px;width:100%;padding:28px 24px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.25);font-family:inherit;");
    var title = el("div", "font-size:20px;font-weight:700;color:" + GREEN + ";margin-bottom:8px;", "Armando tu carrito");
    var msg = el("div", "font-size:15px;color:#333;margin-bottom:16px;", "Agregando 0 de " + total + " productos");
    var track = el("div", "height:10px;background:#e6efe9;border-radius:99px;overflow:hidden;");
    var bar = el("div", "height:100%;width:4%;background:" + GREEN + ";border-radius:99px;transition:width .3s;");
    var note = el("div", "font-size:13px;color:#777;margin-top:12px;", "No cierres esta página, tarda unos segundos.");
    track.appendChild(bar);
    box.appendChild(title); box.appendChild(msg); box.appendChild(track); box.appendChild(note);
    wrap.appendChild(box);
    document.body.appendChild(wrap);
    return {
      progress: function (done) {
        msg.textContent = "Agregando " + done + " de " + total + " productos";
        bar.style.width = Math.max(4, Math.round((done / total) * 100)) + "%";
      },
      finish: function (added, failed) {
        title.textContent = added ? "Listo, agregamos " + added + " productos" : "No pudimos agregar los productos";
        msg.textContent = "Estos no tienen stock online suficiente:";
        bar.style.width = "100%";
        track.style.display = "none";
        var list = el("div", "text-align:left;font-size:14px;color:#333;max-height:180px;overflow:auto;margin:4px 0 16px;");
        failed.forEach(function (n) { list.appendChild(el("div", "padding:4px 0;border-bottom:1px solid #eee;", "• " + n)); });
        note.replaceWith(list);
        var go = el("a", "display:block;background:" + GREEN + ";color:#fff;border-radius:99px;padding:12px;font-weight:700;text-decoration:none;", added ? "Ver mi carrito" : "Volver");
        go.href = added ? "/comprar/" : "#";
        go.onclick = function (ev) { if (!added) { ev.preventDefault(); wrap.remove(); } };
        box.appendChild(go);
      }
    };
  }

  function addAll(lines) {
    var ui = openProgress(lines.length);
    var queue = lines.slice(), retry = [], failed = [], added = 0, done = 0;
    function worker() {
      var line = queue.shift();
      if (!line) return Promise.resolve();
      return addOne(line)
        .then(function () { added++; }, function () { retry.push(line); })
        .then(function () { done++; ui.progress(done); return worker(); });
    }
    var workers = [];
    for (var i = 0; i < PARALLEL; i++) workers.push(worker());
    return Promise.all(workers)
      // Lo que falló se reintenta de a uno (por si dos pedidos chocaron en el carrito).
      .then(function () {
        return retry.reduce(function (p, line) {
          return p.then(function () {
            return addOne(line).then(function () { added++; }, function () { failed.push(line.name); });
          });
        }, Promise.resolve());
      })
      .then(function () {
        reply({ type: "lerma-presupuestador:cart-result", added: added, failed: failed });
        if (!failed.length) window.location.href = "/comprar/";
        else ui.finish(added, failed);
      });
  }

  window.addEventListener("message", function (e) {
    if (e.origin !== ORIGIN || !e.data) return;

    // 1. Alto del iframe
    if (e.data.height) { iframe.style.height = (e.data.height + 24) + "px"; return; }

    // Al pasar de pantalla, mostrar el inicio del presupuestador (debajo del header fijo de la tienda)
    if (e.data.type === "lerma-presupuestador:scroll-top") {
      var top = iframe.getBoundingClientRect().top + window.pageYOffset - 180;
      if (window.pageYOffset > top) window.scrollTo({ top: top, behavior: "smooth" });
      return;
    }

    // 2. Eventos de analítica
    if (e.data.type === "lerma-presupuestador:event") {
      var params = e.data.params || {};
      if (typeof window.gtag === "function") window.gtag("event", "presupuestador_" + e.data.event, params);
      if (typeof window.fbq === "function" && e.data.event === "add_to_cart_clicked") window.fbq("track", "AddToCart", { value: params.total, currency: "ARS" });
      return;
    }

    // 3. Carrito
    if (e.data.type === "lerma-presupuestador:add-to-cart" && Array.isArray(e.data.lines)) {
      reply({ type: "lerma-presupuestador:cart-ack" });
      var lines = e.data.lines.slice(0, 120).filter(function (l) { return l && /^[0-9]+$/.test(String(l.productId)); }).map(function (l) {
        return { productId: l.productId, options: Array.isArray(l.options) ? l.options.slice(0, 3).map(String) : [],
                 quantity: Math.max(1, Math.min(99, parseInt(l.quantity, 10) || 1)), name: String(l.name || "") };
      });
      if (lines.length) addAll(lines);
    }
  });
})();
</script>
